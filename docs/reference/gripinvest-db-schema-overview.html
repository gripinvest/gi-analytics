const COLORS = {
  'Users & Auth':          '#534AB7',
  'Assets & Securities':   '#0F6E56',
  'Orders & Payments':     '#993C1D',
  'KYC & Compliance':      '#993556',
  'Partners & Brokers':    '#185FA5',
  'GCI Partner Platform':  '#3B6D11',
  'Mutual Funds (DMF)':    '#854F0B',
  'Logs & Audit':          '#5F5E5A',
  'Portfolio':             '#A32D2D',
  'Referrals & Rewards':   '#3C3489',
  'Calculations':          '#085041',
  'Communications':        '#712B13',
  'App Config':            '#0C447C',
  'Config & Master':       '#26215C',
  'Documents & E-sign':    '#72243E',
  'Reports':               '#27500A',
  'System & Migrations':   '#444441',
  'Other / Misc':          '#888780'
};
function colorFor(cat) { return COLORS[cat] || '#888780'; }

const tableToCat = {};
for (const [cat, tables] of Object.entries(DATA.cat_tables)) {
  for (const t of tables) tableToCat[t.name] = cat;
}

let activeCategory = null;
let activeTable = null;

const grid = document.getElementById('gi-grid');
const detail = document.getElementById('gi-detail');
const search = document.getElementById('gi-search');
const relsEl = document.getElementById('gi-rels');

const cats = Object.entries(DATA.cat_tables).sort((a, b) => b[1].length - a[1].length);

function escHtml(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s) { return String(s).replace(/["&<>]/g, c => ({'"':'&quot;','&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderGrid() {
  grid.innerHTML = '';
  for (const [cat, tables] of cats) {
    const totalConns = tables.reduce((s, t) => s + t.conns, 0);
    const c = colorFor(cat);
    const card = document.createElement('div');
    card.className = 'gi-card' + (activeCategory === cat ? ' active' : '');
    card.style.borderLeftColor = c;
    card.innerHTML = '<p class="gi-card-title">' + escHtml(cat) + '</p>' +
      '<p class="gi-card-meta"><span>' + tables.length + ' tables</span><span>' + totalConns + ' links</span></p>';
    card.onclick = () => selectCategory(cat);
    grid.appendChild(card);
  }
}

function selectCategory(cat) {
  activeCategory = cat;
  activeTable = null;
  search.value = '';
  renderGrid();
  renderDetail();
}

function selectTable(name) {
  activeTable = name;
  activeCategory = tableToCat[name];
  renderGrid();
  renderDetail();
}

function renderDetail() {
  if (!activeCategory) {
    detail.innerHTML = '<div class="gi-detail-empty">Click a domain above, or search for a table.</div>';
    return;
  }
  const tables = DATA.cat_tables[activeCategory];
  const c = colorFor(activeCategory);
  const totalCols = tables.reduce((s, t) => s + t.cols, 0);
  let html = '<div class="gi-detail-header">' +
    '<p class="gi-detail-title"><span class="gi-dot" style="background:' + c + '"></span>' + escHtml(activeCategory) + '</p>' +
    '<p class="gi-detail-sub">' + tables.length + ' tables · ' + totalCols + ' columns total · click any table for its relationships</p>' +
    '</div><div class="gi-tlist">';
  for (const t of tables) {
    const isActive = t.name === activeTable;
    html += '<div class="gi-trow' + (isActive ? ' active' : '') + '" data-name="' + escAttr(t.name) + '">' +
      '<span class="gi-tname" title="' + escAttr(t.name) + '">' + escHtml(t.name) + '</span>' +
      '<span class="gi-tbadges"><span class="gi-badge" title="columns">' + t.cols + 'c</span>' +
      (t.conns > 0 ? '<span class="gi-badge gi-badge-conn" title="connections">' + t.conns + '↔</span>' : '') +
      '</span></div>';
  }
  html += '</div>';
  if (activeTable && DATA.table_edges[activeTable]) {
    const rels = DATA.table_edges[activeTable];
    html += '<div class="gi-table-detail"><p class="gi-table-detail-name">' + escHtml(activeTable) + '</p>' +
      '<p class="gi-table-detail-rels"><strong style="font-weight:500">Linked tables (' + rels.length + '):</strong><br/>' +
      rels.map(r => '<code>' + escHtml(r) + '</code>').join(' ') + '</p></div>';
  } else if (activeTable) {
    html += '<div class="gi-table-detail"><p class="gi-table-detail-name">' + escHtml(activeTable) + '</p>' +
      '<p class="gi-table-detail-rels">No outbound foreign-key links recorded for this table.</p></div>';
  }
  detail.innerHTML = html;
  detail.querySelectorAll('.gi-trow').forEach(row => {
    row.onclick = () => selectTable(row.dataset.name);
  });
}

function renderRels() {
  relsEl.innerHTML = DATA.cross.map(r => {
    const ca = colorFor(r.a), cb = colorFor(r.b);
    return '<div class="gi-rel"><div class="gi-rel-pair">' +
      '<span class="gi-dot" style="background:' + ca + '"></span><span>' + escHtml(r.a) + '</span>' +
      '<span class="gi-rel-arrow">↔</span>' +
      '<span class="gi-dot" style="background:' + cb + '"></span><span>' + escHtml(r.b) + '</span>' +
      '</div><span class="gi-rel-count">' + r.n + ' link' + (r.n > 1 ? 's' : '') + '</span></div>';
  }).join('');
}

search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { activeCategory = cats[1][0]; activeTable = null; renderGrid(); renderDetail(); return; }
  const matches = [];
  for (const [cat, tables] of Object.entries(DATA.cat_tables)) {
    for (const t of tables) {
      if (t.name.toLowerCase().includes(q)) matches.push(Object.assign({}, t, {cat}));
    }
  }
  if (matches.length === 0) {
    detail.innerHTML = '<div class="gi-detail-empty">No tables matching "' + escHtml(q) + '"</div>';
    return;
  }
  matches.sort((a, b) => b.conns - a.conns);
  let html = '<div class="gi-detail-header"><p class="gi-detail-title">Search: "' + escHtml(q) + '"</p>' +
    '<p class="gi-detail-sub">' + matches.length + ' match' + (matches.length > 1 ? 'es' : '') + ' across all domains</p></div><div class="gi-tlist">';
  for (const t of matches.slice(0, 80)) {
    const c = colorFor(t.cat);
    html += '<div class="gi-trow" data-name="' + escAttr(t.name) + '" title="' + escAttr(t.cat) + '">' +
      '<span class="gi-tname"><span class="gi-dot" style="background:' + c + ';margin-right:6px;width:6px;height:6px"></span>' + escHtml(t.name) + '</span>' +
      '<span class="gi-tbadges"><span class="gi-badge">' + t.cols + 'c</span>' +
      (t.conns > 0 ? '<span class="gi-badge gi-badge-conn">' + t.conns + '↔</span>' : '') +
      '</span></div>';
  }
  html += '</div>';
  if (matches.length > 80) {
    html += '<p style="font-size:12px;color:var(--color-text-tertiary);margin:8px 0 0;text-align:center">Showing first 80 of ' + matches.length + ' matches</p>';
  }
  detail.innerHTML = html;
  detail.querySelectorAll('.gi-trow').forEach(row => {
    row.onclick = () => { search.value = ''; selectTable(row.dataset.name); };
  });
});

renderGrid();
renderRels();
selectCategory('Users & Auth');
</script></body>
