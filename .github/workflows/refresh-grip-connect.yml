name: Refresh Grip Connect data

# Durable populator for the live-data pipeline: pulls fresh Metabase data daily
# and commits the canonical CSVs so accumulated history survives redeploys.
# (Render's container disk is ephemeral; git is the durable store — see
# docs/specs/2026-05-17-grip-connect-live-data-design.md §8.)
#
# Security note: the only ${{ }} interpolations are secrets passed via env:
# (the recommended pattern) and python-version. No untrusted github.event.*
# input is used in any run: step, so there is no workflow-injection surface.

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST daily
  workflow_dispatch: {}

permissions:
  contents: write          # required for the commit-back step to push

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Run refresh
        working-directory: backend
        env:
          METABASE_URL: https://metabase.gripinvest.in
          METABASE_EMAIL: ${{ secrets.METABASE_EMAIL }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
        run: python -m services.integrations.refresh
      - name: Commit refreshed data if changed
        # Commit once, then retry only the push (rebasing between attempts).
        # Sibling refresh workflows push to main concurrently, so a bare push
        # can lose the race and drop the day's commit. Retry the PUSH, not the
        # staging: committing inside the loop and re-checking `git diff
        # --staged` after a rebase exits green WITHOUT re-pushing (the rebase
        # replays the local commit, the tree goes clean, the loop breaks). The
        # explicit success flag fails the step (firing the alert) if exhausted.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/grip_connect/
          if git diff --staged --quiet; then
            echo "no data changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh Grip Connect data"
          success=0
          for i in 1 2 3; do
            if git push; then
              success=1
              break
            fi
            git pull --rebase --autostash
            sleep $((i * 10))
          done
          [ "$success" -eq 1 ]
