name: Refresh Learn Education data

# Daily refresh of the Learn (Grip Education) weekly A/B tracker. Pulls
# the cohort-vs-cohort weekly rollup from Metabase against client_web
# (Rudder Prod) and commits the result.
#
# Cadence — single daily run at 01:00 IST. Rationale:
#  · Weekly A/B aggregation; the cohort metrics do not move meaningfully
#    within a day, so twice-daily would double cost without analytic gain.
#  · Source events live in Rudder (Postgres, permanent storage) — no
#    retention pressure that would mandate twice-daily (cf. Performance
#    Grip's NR Web Vitals 8-day window).
#  · 01:00 IST sits after the prior calendar day in IST is fully closed
#    but before the office wakes up; staggered 1h after Asset Search
#    (00:00 IST) so concurrent pushes to main do not race.
#  · The dashboard's "speed" parity with Grip Connect comes from the
#    query itself (4 CTEs over ~12 weeks × 2 variants = ≤24 output
#    rows); a faster cron does not improve perceived dashboard latency.
#
# Pre-launch behaviour: the fetch module (services/integrations/learn_education.py)
# probes for learn_page_viewed AND experiment_assigned(learn_page) first.
# Both must be > 0 before the main SQL runs. The cron stays harmless and
# emits zero alerts until the gi-client-web feature ships and starts
# producing events.
#
# Security: only secrets via env:, no untrusted github.event.* in run:.

on:
  schedule:
    - cron: "40 19 * * *"   # 01:10 IST — staggered 10 min off performance-grip (also 19:30 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-learn-education
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Run refresh
        working-directory: backend
        env:
          METABASE_URL: https://metabase.gripinvest.in
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          METABASE_EMAIL: ${{ secrets.METABASE_EMAIL }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
        run: python -m services.integrations.refresh learn_education
      - name: Commit refreshed data if changed
        # Commit once, then retry only the push (rebasing between attempts).
        # The prior shape committed *inside* the loop and re-checked `git diff
        # --staged` after a rebase — which exits green WITHOUT re-pushing: on a
        # lost-race retry the rebase replays the local commit, the tree goes
        # clean, `diff --staged --quiet` is true, and the loop breaks with the
        # commit stranded locally (lost on the next checkout). Retry the PUSH,
        # not the staging. The explicit success flag fails the step (firing the
        # alert) if all attempts are exhausted.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/learn_education/
          if git diff --staged --quiet; then
            echo "no data changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh Learn Education data"
          success=0
          for i in 1 2 3; do
            if git push; then
              success=1
              break
            fi
            git pull --rebase --autostash
            sleep $((i * 10))
          done
          [ "$success" -eq 1 ]
      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "::error::Learn Education refresh failed - weekly A/B tracker may be stale."
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST -H 'Content-type: application/json' \
              --data '{"text":"Learn Education refresh failed - see GitHub Actions."}' \
              "$SLACK_WEBHOOK_URL" || true
          fi
